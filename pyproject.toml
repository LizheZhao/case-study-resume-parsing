[project]
name = "resume-search"
version = "0.1.0"
description = "Candidate resume search platform: LLM parsing, SQLite storage, hybrid search, Streamlit UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.125",
    "pydantic>=2.9",
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "wordfreq>=3.1",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.2.0",
    "numpy>=2.5.4",
    "streamlit>=1.66.1",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
resume-search = "resume_search.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_search"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
